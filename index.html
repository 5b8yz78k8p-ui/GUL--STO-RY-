<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GULÌSTORY</title>
    <style>
        body { font-family: 'Georgia', serif; background: linear-gradient(135deg, #0a2e1f 0%, #1a4a2e 50%, #0a2e1f 100%); color: #f5f5dc; margin: 0; padding: 20px; overflow-x: hidden; position: relative; min-height: 100vh; }
        
        .flower-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; opacity: 0.8; }
        .flower { position: absolute; background: radial-gradient(circle, #ffffff 20%, transparent 20%), radial-gradient(circle, #ffffff 20%, transparent 20%), radial-gradient(circle, #ffffff 20%, transparent 20%), radial-gradient(circle, #ffffff 20%, transparent 20%), radial-gradient(circle, #ffffff 20%, transparent 20%); background-size: 10px 10px; background-position: 0 0, 10px 0, 5px -5px, -5px -5px, 0 -10px; border-radius: 50%; animation: float 10s infinite ease-in-out; }
        .flower:nth-child(1) { width: 40px; height: 40px; top: 10%; left: 5%; }
        .flower:nth-child(2) { width: 25px; height: 25px; top: 60%; left: 90%; animation-delay: 2s; }
        .flower:nth-child(3) { width: 30px; height: 30px; top: 80%; left: 15%; animation-delay: 4s; }
        .flower:nth-child(4) { width: 20px; height: 20px; top: 30%; left: 80%; animation-delay: 6s; }
        .flower:nth-child(5) { width: 50px; height: 50px; top: 5%; right: 10%; animation-delay: 8s; }
        .flower:nth-child(6) { width: 35px; height: 35px; top: 45%; left: 50%; animation-delay: 1s; }
        @keyframes float { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-20px) rotate(45deg); } }

        body.modal-open { overflow: hidden; }

        header { text-align: center; margin-bottom: 30px; position: relative; z-index: 1; }
        h1 { color: #e6d5a8; letter-spacing: 4px; text-transform: uppercase; font-size: 2.5em; border-bottom: 2px solid #e6d5a8; display: inline-block; padding-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        header p { color: #f5f5dc; font-size: 1.2em; margin-top: 10px; }

        .floating-cart { position: fixed; top: 20px; right: 20px; z-index: 100; background: rgba(10, 46, 31, 0.95); border: 2px solid #e6d5a8; border-radius: 16px; padding: 10px 15px; text-align: center; transition: 0.3s; cursor: pointer; }
        .floating-cart:hover { border-color: #ffffff; }
        .floating-cart-text { color: #e6d5a8; font-size: 1.2em; font-weight: bold; letter-spacing: 1px; }
        .floating-cart-icon { font-size: 0.9em; color: #e6d5a8; }
        .floating-cart-count { font-size: 1em; color: #0a2e1f; background: #e6d5a8; border-radius: 50%; padding: 2px 8px; position: absolute; top: -5px; right: -5px; }

        .floating-admin { position: fixed; top: 20px; left: 20px; z-index: 100; background: rgba(10, 46, 31, 0.95); border: 2px solid #e6d5a8; border-radius: 16px; padding: 10px 15px; text-align: center; transition: 0.3s; cursor: pointer; }
        .floating-admin:hover { border-color: #ffffff; }
        .floating-admin-text { color: #e6d5a8; font-size: 1.2em; font-weight: bold; letter-spacing: 1px; }

        .cart-dropdown { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1000; background: rgba(10, 46, 31, 0.98); border: 2px solid #e6d5a8; border-radius: 16px; padding: 20px; max-width: 250px; width: 80%; display: none; }
        .cart-dropdown.active { display: flex; flex-direction: column; }
        .cart-dropdown h2 { color: #e6d5a8; border-bottom: 2px solid #e6d5a8; padding-bottom: 10px; }
        .cart-item { display: flex; justify-content: space-between; margin-bottom: 10px; border-bottom: 1px solid rgba(230, 213, 168, 0.3); padding-bottom: 5px; color: #f5f5dc; }
        .total { font-size: 1.5em; font-weight: bold; color: #e6d5a8; text-align: right; margin-top: 20px; }
        .whatsapp-btn { display: block; background-color: #25D366; color: white; text-decoration: none; padding: 15px; text-align: center; border-radius: 30px; font-size: 1.2em; margin-top: 20px; font-weight: bold; }
        .whatsapp-btn:hover { background-color: #128C7E; }
        .close-cart { background: #ff4d4d; color: white; border: none; border-radius: 50%; width: 30px; height: 30px; font-size: 16px; cursor: pointer; position: absolute; top: 10px; right: 10px; }

        .goods-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 25px; max-width: 1000px; margin: 0 auto; position: relative; z-index: 1; }
        .card { background: rgba(10, 46, 31, 0.9); border: 2px solid #e6d5a8; border-radius: 16px; padding: 20px; box-shadow: 0 8px 16px rgba(0,0,0,0.5); text-align: center; transition: 0.4s; }
        .card:hover { border-color: #ffffff; transform: translateY(-8px); box-shadow: 0 16px 32px rgba(230, 213, 168, 0.3); }
        .card img { max-width: 100%; border-radius: 12px; height: 200px; object-fit: cover; margin-bottom: 15px; border: 1px solid #e6d5a8; cursor: pointer; }
        .card img:hover { transform: scale(1.03); }
        .price { color: #e6d5a8; font-weight: bold; font-size: 1.4em; margin: 10px 0; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); }
        .add-btn { background-color: #e6d5a8; color: #0a2e1f; border: none; padding: 12px 20px; border-radius: 20px; cursor: pointer; font-size: 16px; width: 100%; font-weight: bold; letter-spacing: 1px; }
        .add-btn:hover { background-color: #ffffff; color: #0a2e1f; transform: scale(1.03); }

        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal.active { display: flex; }
        .modal-content { background: rgba(10, 46, 31, 0.95); border: 2px solid #e6d5a8; border-radius: 16px; padding: 25px; text-align: center; max-width: 450px; width: 90%; position: relative; }
        .modal-content img { max-width: 100%; max-height: 50vh; border-radius: 12px; object-fit: contain; border: 1px solid #e6d5a8; }
        .modal-price { color: #e6d5a8; font-weight: bold; font-size: 1.8em; margin: 15px 0; }
        .modal-btn { background-color: #e6d5a8; color: #0a2e1f; border: none; padding: 12px 20px; border-radius: 20px; cursor: pointer; font-size: 16px; width: 100%; font-weight: bold; }
        .modal-btn:hover { background-color: #ffffff; color: #0a2e1f; }
        .close-modal { background: #ff4d4d; color: white; border: none; border-radius: 50%; width: 30px; height: 30px; font-size: 16px; cursor: pointer; position: absolute; top: 10px; right: 10px; }

        .auth-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); display: none; justify-content: center; align-items: center; z-index: 2000; }
        .auth-modal.active { display: flex; }
        .auth-content { background: rgba(10, 46, 31, 0.95); border: 2px solid #e6d5a8; border-radius: 16px; padding: 25px; text-align: center; max-width: 350px; width: 90%; position: relative; }
        .auth-content input { width: 100%; padding: 12px; margin: 15px 0; border-radius: 10px; border: 1px solid #e6d5a8; background: #0a2e1f; color: #fff; box-sizing: border-box; font-size: 1em; text-align: center; }
        .auth-btn { background-color: #e6d5a8; color: #0a2e1f; border: none; padding: 12px 20px; border-radius: 20px; cursor: pointer; font-size: 16px; width: 100%; font-weight: bold; }
        .auth-btn:hover { background-color: #ffffff; }

        .admin-panel { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.95); display: none; justify-content: center; align-items: flex-start; z-index: 3000; overflow-y: auto; padding: 20px 0; }
        .admin-panel.active { display: flex; }
        .admin-content { background: rgba(10, 46, 31, 0.98); border: 2px solid #e6d5a8; border-radius: 16px; padding: 20px; max-width: 800px; width: 95%; position: relative; margin: 20px; }
        .admin-content h2 { color: #e6d5a8; text-align: center; margin-top: 0; border-bottom: 2px solid #e6d5a8; padding-bottom: 10px; }
        .admin-close { position: absolute; top: 10px; right: 15px; background: #ff4d4d; color: white; border: none; border-radius: 50%; width: 30px; height: 30px; font-size: 16px; cursor: pointer; }
        .product-edit { background: rgba(255,255,255,0.05); border: 1px solid rgba(230, 213, 168, 0.3); border-radius: 10px; padding: 15px; margin-bottom: 15px; display: flex; flex-direction: column; gap: 10px; }
        .product-edit h3 { color: #e6d5a8; margin: 0; font-size: 1.1em; }
        .product-edit label { font-size: 0.9em; color: #aaa; margin-bottom: -5px; }
        .product-edit input { padding: 8px; border-radius: 5px; border: 1px solid #e6d5a8; background: #0a2e1f; color: #fff; width: 100%; box-sizing: border-box; }
        
        .file-input-wrapper { position: relative; overflow: hidden; display: inline-block; width: 100%; }
        .file-input-wrapper input[type=file] { font-size: 100px; position: absolute; left: 0; top: 0; opacity: 0; cursor: pointer; height: 100%; width: 100%; }
        .file-btn { background-color: #e6d5a8; color: #0a2e1f; border: none; padding: 10px; border-radius: 8px; font-size: 1em; font-weight: bold; cursor: pointer; width: 100%; text-align: center; display: block; box-sizing: border-box; }
        .preview-img { max-width: 100px; max-height: 100px; object-fit: cover; border-radius: 5px; border: 1px solid #e6d5a8; margin-top: 5px; }

        .save-btn { background: #25D366; color: white; border: none; padding: 10px; border-radius: 10px; font-size: 1em; font-weight: bold; cursor: pointer; margin-top: 10px; width: 100%; }
        .save-btn:hover { background: #128C7E; }
        
        /* Стили для загрузки (спиннер) */
        .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 4000; flex-direction: column; }
        .loading-overlay.active { display: flex; }
        .spinner { border: 4px solid rgba(255,255,255,0.3); border-top: 4px solid #e6d5a8; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loading-text { color: #e6d5a8; font-size: 1.2em; }
    </style>
</head>
<body>
    <div class="flower-bg">
        <div class="flower"></div>
        <div class="flower"></div>
        <div class="flower"></div>
        <div class="flower"></div>
        <div class="flower"></div>
        <div class="flower"></div>
    </div>

    <header>
        <h1>GULÌSTORY</h1>
        <p>Будь у себя в приоритете</p>
    </header>

    <div class="floating-admin" onclick="openAuth()">
        <span class="floating-admin-text">Админ ⚙️</span>
    </div>

    <div class="floating-cart" onclick="openCart()">
        <span class="floating-cart-text">Корзина</span>
        <span class="floating-cart-icon">🛒</span>
        <div class="floating-cart-count" id="floating-count">0</div>
    </div>

    <div class="cart-dropdown" id="cart-dropdown">
        <button class="close-cart" onclick="closeCart()">X</button>
        <h2>🛒 Ваша корзина</h2>
        <div id="cart-items" class="cart-items-scroll"></div>
        <div class="total">Итого: <span id="total-price">0</span> ₽</div>
        <a href="#" id="whatsapp-link" class="whatsapp-btn" target="_blank">Оформить в WhatsApp 📲</a>
    </div>

    <!-- Здесь будут рендериться товары из Firebase -->
    <div class="goods-grid" id="goods-grid">
        <p style="color:#e6d5a8; text-align:center; width:100%; grid-column: 1 / -1;">Загрузка товаров...</p>
    </div>

    <!-- Модалка товара -->
    <div class="modal" id="modal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="close-modal" onclick="closeModal()">X</button>
            <img id="modal-image" src="" alt="Фото товара">
            <div class="modal-price" id="modal-price"></div>
            <button class="modal-btn" id="modal-add-btn">Добавить в корзину</button>
        </div>
    </div>

    <!-- Авторизация -->
    <div class="auth-modal" id="auth-modal">
        <div class="auth-content">
            <h3 style="color:#e6d5a8; margin-top:0;">Вход в админ-панель</h3>
            <input type="password" id="admin-password" placeholder="Введите пароль...">
            <button class="auth-btn" onclick="checkPassword()">Войти</button>
            <button class="auth-btn" style="background:#ff4d4d; color:white; margin-top:10px;" onclick="closeAuth()">Отмена</button>
        </div>
    </div>

    <!-- Админка -->
    <div class="admin-panel" id="admin-panel">
        <div class="admin-content">
            <button class="admin-close" onclick="closeAdmin()">X</button>
            <h2>Управление товарами</h2>
            <div id="admin-products-list"></div>
            <button class="save-btn" onclick="saveAdminChanges()">Сохранить все изменения</button>
        </div>
    </div>

    <!-- Оверлей загрузки -->
    <div class="loading-overlay" id="loading-overlay">
        <div class="spinner"></div>
        <div class="loading-text" id="loading-text">Загрузка...</div>
    </div>

    <!-- ПОДКЛЮЧАЕМ FIREBASE (CDN) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, setDoc, addDoc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        // Твоя конфигурация
        const firebaseConfig = {
            apiKey: "AIzaSyBQABRSfd8HGHrabbXyqhN1KN-_mS8G-8Y",
            authDomain: "gulistory.firebaseapp.com",
            projectId: "gulistory",
            storageBucket: "gulistory.firebasestorage.app",
            messagingSenderId: "518381931530",
            appId: "1:518381931530:web:37c847433217e06f4ca3f3",
            measurementId: "G-4G34PENK9Y"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);

        // Глобальные переменные для доступа из обычного скрипта
        window.firebaseDB = db;
        window.firebaseStorage = storage;
        window.firebaseCollection = collection;
        window.firebaseGetDocs = getDocs;
        window.firebaseDoc = doc;
        window.firebaseSetDoc = setDoc;
        window.firebaseAddDoc = addDoc;
        window.firebaseUpdateDoc = updateDoc;
        window.firebaseDeleteDoc = deleteDoc;
        window.firebaseRef = ref;
        window.firebaseUploadBytes = uploadBytes;
        window.firebaseGetDownloadURL = getDownloadURL;

        // Сообщаем, что Firebase готов
        window.firebaseReady = true;
        document.dispatchEvent(new Event('firebaseReady'));
    </script>

    <!-- ОСНОВНОЙ СКРИПТ САЙТА -->
    <script>
        let products = [];
        let cart = [];
        const ADMIN_PASSWORD = "Story5155";
        let tempImages = {};
        let isFirebaseReady = false;

        // Ждем загрузки Firebase
        document.addEventListener('firebaseReady', () => {
            isFirebaseReady = true;
            loadProductsFromFirebase();
        });

        // Функция загрузки товаров из Firestore
        async function loadProductsFromFirebase() {
            if (!isFirebaseReady) return;
            const grid = document.getElementById('goods-grid');
            grid.innerHTML = '<p style="color:#e6d5a8; text-align:center; width:100%; grid-column: 1 / -1;">Загрузка товаров...</p>';

            try {
                const querySnapshot = await window.firebaseGetDocs(window.firebaseCollection(window.firebaseDB, "products"));
                
                // Если база пуста — заполняем её товарами по умолчанию
                if (querySnapshot.empty) {
                    await seedDefaultProducts();
                    return;
                }

                products = [];
                querySnapshot.forEach((doc) => {
                    products.push({ id: doc.id, ...doc.data() });
                });

                // Сортируем по id (или по порядку добавления)
                products.sort((a, b) => a.order - b.order);
                renderProducts();

            } catch (e) {
                console.error("Ошибка загрузки: ", e);
                grid.innerHTML = '<p style="color:red; text-align:center; width:100%;">Ошибка подключения к базе данных. Проверьте настройки Firebase.</p>';
            }
        }

        // Заполнение базы начальными данными
        async function seedDefaultProducts() {
            const defaults = [
                { name: "Товар 1", price: 6400, image: "https://i.postimg.cc/1t5xCHSF/e42775bd-ac88-421d-83ad-e4ee13cf133f.jpg", order: 1 },
                { name: "Товар 2", price: 6400, image: "https://i.postimg.cc/MTsChQZv/9a9427f7-cc7b-4ee0-a2a9-c59b918fab87.jpg", order: 2 },
                { name: "Товар 3", price: 0, image: "https://placehold.co/400x400/0a2e1f/e6d5a8?text=Фото", order: 3 },
                { name: "Товар 4", price: 0, image: "https://placehold.co/400x400/0a2e1f/e6d5a8?text=Фото", order: 4 },
                { name: "Товар 5", price: 0, image: "https://placehold.co/400x400/0a2e1f/e6d5a8?text=Фото", order: 5 },
                { name: "Товар 6", price: 0, image: "https://placehold.co/400x400/0a2e1f/e6d5a8?text=Фото", order: 6 },
                { name: "Товар 7", price: 0, image: "https://placehold.co/400x400/0a2e1f/e6d5a8?text=Фото", order: 7 },
                { name: "Товар 8", price: 0, image: "https://placehold.co/400x400/0a2e1f/e6d5a8?text=Фото", order: 8 },
                { name: "Товар 9", price: 0, image: "https://placehold.co/400x400/0a2e1f/e6d5a8?text=Фото", order: 9 },
                { name: "Товар 10", price: 0, image: "https://placehold.co/400x400/0a2e1f/e6d5a8?text=Фото", order: 10 }
            ];

            for (const item of defaults) {
                await window.firebaseAddDoc(window.firebaseCollection(window.firebaseDB, "products"), item);
            }
            // Перезагружаем после заполнения
            loadProductsFromFirebase();
        }

        function renderProducts() {
            const grid = document.getElementById('goods-grid');
            grid.innerHTML = '';
            products.forEach(p => {
                grid.innerHTML += `
                    <div class="card">
                        <img src="${p.image}" alt="${p.name}" onclick="openModal('${p.image}', ${p.price}, '${p.name}')">
                        <div class="price"><span class="price-value">${p.price}</span> ₽</div>
                        <button class="add-btn" onclick="addToCart('${p.name}', ${p.price})">Добавить в корзину</button>
                    </div>
                `;
            });
        }

        // --- АДМИНКА ---
        function openAuth() {
            document.getElementById('auth-modal').classList.add('active');
            document.getElementById('admin-password').value = '';
        }

        function closeAuth() {
            document.getElementById('auth-modal').classList.remove('active');
        }

        function checkPassword() {
            const pass = document.getElementById('admin-password').value;
            if (pass === ADMIN_PASSWORD) {
                closeAuth();
                openAdmin();
            } else {
                alert("Неверный пароль!");
            }
        }

        function openAdmin() {
            const panel = document.getElementById('admin-panel');
            const list = document.getElementById('admin-products-list');
            list.innerHTML = '';
            tempImages = {};
            
            products.forEach((p, index) => {
                list.innerHTML += `
                    <div class="product-edit">
                        <h3>${p.name}</h3>
                        <label>Название:</label>
                        <input type="text" id="admin-name-${index}" value="${p.name}">
                        
                        <label>Цена (₽):</label>
                        <input type="number" id="admin-price-${index}" value="${p.price}">
                        
                        <label>Фото товара:</label>
                        <img src="${p.image}" id="admin-preview-${index}" class="preview-img" alt="Превью">
                        <div class="file-input-wrapper">
                            <button class="file-btn">Выбрать фото с устройства</button>
                            <input type="file" accept="image/*" onchange="handleImageUpload(event, ${index})">
                        </div>
                    </div>
                `;
            });
            
            panel.classList.add('active');
        }

        function handleImageUpload(event, index) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                tempImages[index] = e.target.result;
                document.getElementById('admin-preview-' + index).src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function closeAdmin() {
            document.getElementById('admin-panel').classList.remove('active');
        }

        async function saveAdminChanges() {
            if (!isFirebaseReady) return alert("Firebase еще не загружен!");
            
            const overlay = document.getElementById('loading-overlay');
            const loadingText = document.getElementById('loading-text');
            overlay.classList.add('active');

            try {
                for (let index = 0; index < products.length; index++) {
                    const p = products[index];
                    const newName = document.getElementById('admin-name-' + index).value;
                    const newPrice = parseInt(document.getElementById('admin-price-' + index).value) || 0;
                    
                    let imageUrl = p.image; // Старая ссылка

                    // Если выбрали новое фото — загружаем в Storage
                    if (tempImages[index]) {
                        loadingText.innerText = `Загрузка фото для "${newName}"...`;
                        // Конвертируем base64 обратно в файл
                        const response = await fetch(tempImages[index]);
                        const blob = await response.blob();
                        // Создаем уникальное имя файла
                        const fileName = `product_${Date.now()}_${index}.jpg`;
                        const storageRef = window.firebaseRef(window.firebaseStorage, `products/${fileName}`);
                        
                        await window.firebaseUploadBytes(storageRef, blob);
                        imageUrl = await window.firebaseGetDownloadURL(storageRef);
                    }

                    loadingText.innerText = `Сохранение товара: ${newName}...`;
                    
                    // Обновляем документ в Firestore
                    const docRef = window.firebaseDoc(window.firebaseDB, "products", p.id);
                    await window.firebaseUpdateDoc(docRef, {
                        name: newName,
                        price: newPrice,
                        image: imageUrl
                    });
                }

                // Перезагружаем товары
                await loadProductsFromFirebase();
                closeAdmin();
                alert("Все изменения успешно сохранены в базе данных!");

            } catch (e) {
                console.error("Ошибка сохранения: ", e);
                alert("Ошибка при сохранении! Проверьте консоль и настройки Firebase.");
            } finally {
                overlay.classList.remove('active');
            }
        }

        // --- КОРЗИНА И МОДАЛКИ ---
        function toggleScrollLock(lock) {
            document.body.style.overflow = lock ? 'hidden' : '';
        }

        function openModal(imageSrc, price, name) {
            const modal = document.getElementById('modal');
            document.getElementById('modal-image').src = imageSrc;
            document.getElementById('modal-price').innerText = `${price} ₽`;
            document.getElementById('modal-add-btn').onclick = function() { addToCart(name, price); closeModal(); };
            modal.classList.add('active');
            toggleScrollLock(true);
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
            toggleScrollLock(false);
        }

        function openCart() {
            document.getElementById('cart-dropdown').classList.add('active');
            toggleScrollLock(true);
        }

        function closeCart() {
            document.getElementById('cart-dropdown').classList.remove('active');
            toggleScrollLock(false);
        }

        function addToCart(name, price) {
            cart.push({ name, price });
            updateCart();
        }

        function updateCart() {
            const cartContainer = document.getElementById('cart-items');
            const totalContainer = document.getElementById('total-price');
            const floatingCount = document.getElementById('floating-count');
            cartContainer.innerHTML = '';
            let total = 0;
            cart.forEach((item, index) => {
                total += item.price;
                cartContainer.innerHTML += `
                    <div class="cart-item">
                        <span>${item.name}</span>
                        <span>${item.price} ₽ 
                            <button onclick="removeFromCart(${index})" style="background:red; color:white; border:none; border-radius:5px; cursor:pointer;">X</button>
                        </span>
                    </div>
                `;
            });
            totalContainer.innerText = total;
            floatingCount.innerText = cart.length;

            const phone = "+79388955155";
            let message = "Здравствуйте! Хочу оформить заказ в GULÌSTORY:%0A";
            cart.forEach((item, index) => {
                message += `${index + 1}. ${item.name} - ${item.price}₽%0A`;
            });
            message += `%0AИтого: ${total}₽`;
            const link = document.getElementById('whatsapp-link');
            link.href = `https://wa.me/${phone.replace('+', '')}?text=${message}`;
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCart();
        }
    </script>
</body>
</html>
