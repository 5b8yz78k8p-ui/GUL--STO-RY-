<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Расписание учителя</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    min-height: 100vh; padding: 20px; color: #333;
  }
  .container {
    max-width: 950px; margin: 0 auto; background: #fff;
    border-radius: 16px; padding: 25px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.25);
  }
  h1 { text-align: center; color: #4a3f8a; margin-bottom: 20px; font-size: 26px; }
  .info { text-align: center; color: #666; margin-bottom: 20px; font-size: 14px; }

  /* --- Переключатель смен --- */
  .shift-tabs {
    display: flex; gap: 10px; margin-bottom: 20px;
    background: #f0f0f8; padding: 6px; border-radius: 12px;
  }
  .shift-tab {
    flex: 1; padding: 12px; border: none; border-radius: 8px;
    font-size: 16px; font-weight: bold; cursor: pointer;
    background: transparent; color: #666; transition: all 0.2s;
  }
  .shift-tab.active {
    background: #fff; color: #4a3f8a;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }

  .day-block {
    margin-bottom: 15px; padding: 14px; background: #f7f7fb;
    border-radius: 10px; border-left: 4px solid #667eea;
  }
  .day-block h3 { color: #4a3f8a; margin-bottom: 10px; font-size: 17px; }
  .lesson-row {
    display: flex; gap: 6px; margin-bottom: 8px; align-items: center;
    flex-wrap: wrap;
  }
  .num-badge { font-weight: bold; color: #764ba2; min-width: 20px; text-align: center; }
  select {
    padding: 8px 8px; border: 2px solid #ddd; border-radius: 8px;
    font-size: 13px; font-family: inherit; background: #fff; cursor: pointer;
  }
  select:focus { outline: none; border-color: #667eea; }
  .lesson-number-select { flex: 0.9; min-width: 95px; }
  .grade-select         { flex: 0.9; min-width: 95px; }
  .letter-select        { flex: 0.5; min-width: 60px; }
  .subject-select       { flex: 1.4; min-width: 135px; }

  .remove-btn {
    background: #ff5757; color: #fff; border: none;
    width: 30px; height: 30px; border-radius: 8px;
    font-size: 17px; font-weight: bold; cursor: pointer; line-height: 1;
    flex-shrink: 0;
  }
  .add-btn {
    background: #eef0ff; color: #4a3f8a; border: none;
    padding: 8px 14px; border-radius: 8px; font-size: 13px;
    font-weight: bold; cursor: pointer; margin-top: 4px;
  }
  .add-btn:hover { background: #dfe3ff; }

  button { font-family: inherit; }
  .btn-primary {
    padding: 12px 24px; font-size: 16px; border: none;
    border-radius: 8px; cursor: pointer; font-weight: bold;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff; width: 100%;
    box-shadow: 0 4px 15px rgba(102,126,234,0.4);
  }
  .btn-secondary {
    padding: 12px 24px; font-size: 16px; border: none;
    border-radius: 8px; cursor: pointer; font-weight: bold;
    background: #eee; color: #4a3f8a; margin-right: 10px;
  }
  .btn-danger {
    padding: 12px 24px; font-size: 16px; border: none;
    border-radius: 8px; cursor: pointer; font-weight: bold;
    background: #ff5757; color: #fff;
  }
  .actions { margin-top: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
  .hidden { display: none !important; }

  /* --- Экран просмотра --- */
  .view-header {
    display: flex; align-items: center; gap: 10px; margin-bottom: 15px;
    border-bottom: 2px solid #eee; padding-bottom: 10px;
  }
  .view-header h2 { color: #4a3f8a; font-size: 20px; }

  .schedule-card {
    padding: 15px; background: #f7f7fb; border-radius: 10px;
    border-left: 4px solid #764ba2; margin-bottom: 12px;
  }
  .schedule-card h3 { color: #4a3f8a; margin-bottom: 8px; font-size: 17px; }
  .schedule-card ul { list-style: none; }
  .schedule-card li {
    padding: 8px 0 8px 22px; position: relative;
    border-bottom: 1px dashed #ddd; font-size: 15px;
  }
  .schedule-card li:last-child { border-bottom: none; }
  .schedule-card li::before { content: "📘"; position: absolute; left: 0; }
  .lesson-label { font-weight: bold; color: #4a3f8a; }
  .empty { color: #999; font-style: italic; padding-left: 0 !important; }
  .empty::before { content: "" !important; }

  .share-block {
    margin-top: 20px; padding: 15px; background: #eef7ff;
    border-radius: 10px; border-left: 4px solid #3399ff; font-size: 14px;
  }
  .share-block p { margin-bottom: 10px; color: #1a4f7a; }
  .share-link {
    width: 100%; padding: 10px; border: 2px solid #bcd9f2; border-radius: 8px;
    font-size: 12px; font-family: monospace; background: #fff; margin-bottom: 10px;
  }
  .btn-copy {
    padding: 10px 20px; font-size: 14px; border: none;
    border-radius: 8px; cursor: pointer; font-weight: bold;
    background: #3399ff; color: #fff;
  }
</style>
</head>
<body>
<div class="container">
  <h1>📅 Расписание учителя</h1>

  <!-- КНОПКИ СМЕН -->
  <div class="shift-tabs">
    <button class="shift-tab active" id="tab1" onclick="switchShift(1)">1 смена</button>
    <button class="shift-tab" id="tab2" onclick="switchShift(2)">2 смена</button>
  </div>

  <!-- ПРОСМОТР -->
  <div id="viewScreen" class="hidden">
    <div class="view-header">
      <h2 id="viewShiftTitle">1 смена</h2>
    </div>
    <div id="scheduleView"></div>
    <div class="actions">
      <button class="btn-secondary" id="editBtn">✏️ Изменить</button>
      <button class="btn-danger" id="resetBtn">🗑️ Сбросить эту смену</button>
    </div>

    <div class="share-block">
      <p>✅ Расписание сохранено. <b>Скопируй ссылку и сохрани её</b> — в ней обе смены:</p>
      <input type="text" class="share-link" id="shareLink" readonly>
      <button class="btn-copy" id="copyBtn">📋 Скопировать ссылку</button>
    </div>
  </div>

  <!-- РЕДАКТИРОВАНИЕ -->
  <div id="editScreen">
    <p class="info" id="editInfo">1 смена: выбери номер урока, класс, букву и предмет.</p>

    <div id="editContainer">
      <!-- дни будут генерироваться скриптом -->
    </div>

    <div class="actions">
      <button class="btn-primary" id="saveBtn">💾 Сохранить эту смену</button>
    </div>
  </div>
</div>

<script>
  const DAYS = ["Понедельник","Вторник","Среда","Четверг","Пятница","Суббота"];
  const LESSON_NUMBERS = ["1","2","3","4","5","6","7","8"];
  const GRADES = ["5","6","7","8","9","10","11"];
  const LETTERS = ["А","Б","В","Г"];
  const SUBJECTS = ["Чеченский язык","Чеченская литература"];
  const HASH_PREFIX = "#schedule=";

  // Полное расписание: { "1": {...}, "2": {...} }
  let fullSchedule = { "1": {}, "2": {} };
  let currentShift = 1;

  const editScreen   = document.getElementById("editScreen");
  const viewScreen   = document.getElementById("viewScreen");
  const scheduleView = document.getElementById("scheduleView");
  const editContainer= document.getElementById("editContainer");
  const shareLink    = document.getElementById("shareLink");
  const viewShiftTitle = document.getElementById("viewShiftTitle");
  const editInfo     = document.getElementById("editInfo");
  const tab1         = document.getElementById("tab1");
  const tab2         = document.getElementById("tab2");

  /* ---------- Чтение из ссылки ---------- */
  function loadAll() {
    try {
      if (location.hash.indexOf(HASH_PREFIX) === 0) {
        const raw = location.hash.slice(HASH_PREFIX.length);
        const parsed = JSON.parse(decodeURIComponent(raw));
        // поддерживаем старый формат (просто дни) — переносим в 1 смену
        if (parsed["Понедельник"] !== undefined) {
          return { "1": parsed, "2": {} };
        }
        return { "1": parsed["1"] || {}, "2": parsed["2"] || {} };
      }
    } catch(e) { console.warn("Ошибка чтения ссылки:", e); }
    return null;
  }

  function buildShareLink() {
    const base = location.origin + location.pathname + location.search;
    const hash = HASH_PREFIX + encodeURIComponent(JSON.stringify(fullSchedule));
    return base + hash;
  }

  function escapeHtml(str) {
    const d = document.createElement("div");
    d.textContent = str == null ? "" : str;
    return d.innerHTML;
  }

  /* ---------- Переключение смены ---------- */
  function switchShift(num) {
    currentShift = num;
    tab1.classList.toggle("active", num === 1);
    tab2.classList.toggle("active", num === 2);

    // если сейчас режим просмотра — перерисуем
    if (!viewScreen.classList.contains("hidden")) {
      showView();
    } else {
      // если режим редактирования — перезаполним форму
      fillForm();
    }
  }

  /* ---------- Построение формы ---------- */
  function buildEditDays() {
    editContainer.innerHTML = "";
    DAYS.forEach(day => {
      const block = document.createElement("div");
      block.className = "day-block";
      block.setAttribute("data-day", day);
      block.innerHTML =
        "<h3>" + day + "</h3>" +
        '<div class="lessons"></div>' +
        '<button class="add-btn" type="button" onclick="addLesson(\'' + day + '\')">+ Добавить урок</button>';
      editContainer.appendChild(block);
    });
  }

  function buildLessonRow(lessonNum, grade, letter, subject, num) {
    const row = document.createElement("div");
    row.className = "lesson-row";

    const numBadge = document.createElement("span");
    numBadge.className = "num-badge";
    numBadge.textContent = num + ".";

    const lessonNumSel = document.createElement("select");
    lessonNumSel.className = "lesson-number-select";
    LESSON_NUMBERS.forEach(n => {
      const o = document.createElement("option");
      o.value = n; o.textContent = n + " урок";
      if (n === lessonNum) o.selected = true;
      lessonNumSel.appendChild(o);
    });

    const gradeSel = document.createElement("select");
    gradeSel.className = "grade-select";
    GRADES.forEach(g => {
      const o = document.createElement("option");
      o.value = g; o.textContent = g + " класс";
      if (g === grade) o.selected = true;
      gradeSel.appendChild(o);
    });

    const letterSel = document.createElement("select");
    letterSel.className = "letter-select";
    LETTERS.forEach(l => {
      const o = document.createElement("option");
      o.value = l; o.textContent = l;
      if (l === letter) o.selected = true;
      letterSel.appendChild(o);
    });

    const subjSel = document.createElement("select");
    subjSel.className = "subject-select";
    SUBJECTS.forEach(s => {
      const o = document.createElement("option");
      o.value = s; o.textContent = s;
      if (s === subject) o.selected = true;
      subjSel.appendChild(o);
    });

    const removeBtn = document.createElement("button");
    removeBtn.type = "button";
    removeBtn.className = "remove-btn";
    removeBtn.textContent = "×";
    removeBtn.onclick = () => {
      const parent = row.parentElement;
      row.remove();
      renumberDay(parent);
    };

    row.appendChild(numBadge);
    row.appendChild(lessonNumSel);
    row.appendChild(gradeSel);
    row.appendChild(letterSel);
    row.appendChild(subjSel);
    row.appendChild(removeBtn);
    return row;
  }

  function renumberDay(container) {
    if (!container) return;
    container.querySelectorAll(".lesson-row").forEach((r, i) => {
      r.querySelector(".num-badge").textContent = (i + 1) + ".";
    });
  }

  function addLesson(day, lessonNum, grade, letter, subject) {
    const block = editContainer.querySelector('.day-block[data-day="' + day + '"]');
    const lessonsDiv = block.querySelector(".lessons");
    const num = lessonsDiv.querySelectorAll(".lesson-row").length + 1;
    const defaultLessonNum = lessonNum || LESSON_NUMBERS[(num - 1) % LESSON_NUMBERS.length];
    const row = buildLessonRow(
      defaultLessonNum,
      grade || GRADES[0],
      letter || LETTERS[0],
      subject || SUBJECTS[0],
      num
    );
    lessonsDiv.appendChild(row);
  }

  function fillForm() {
    const schedule = fullSchedule[currentShift] || {};
    DAYS.forEach(day => {
      const block = editContainer.querySelector('.day-block[data-day="' + day + '"]');
      const lessonsDiv = block.querySelector(".lessons");
      lessonsDiv.innerHTML = "";
      const arr = schedule[day] || [];
      if (arr.length === 0) {
        addLesson(day);
      } else {
        arr.forEach(l => addLesson(day, l.lessonNum, l.grade, l.letter || "А", l.subject));
      }
    });
    editInfo.textContent = currentShift + " смена: выбери номер урока, класс, букву и предмет.";
  }

  function collectForm() {
    const schedule = {};
    DAYS.forEach(day => {
      const block = editContainer.querySelector('.day-block[data-day="' + day + '"]');
      const lessons = [];
      block.querySelectorAll(".lesson-row").forEach(r => {
        const lessonNum = r.querySelector(".lesson-number-select").value;
        const grade     = r.querySelector(".grade-select").value;
        const letter    = r.querySelector(".letter-select").value;
        const subject   = r.querySelector(".subject-select").value;
        if (lessonNum && grade && letter && subject) {
          lessons.push({ lessonNum, grade, letter, subject });
        }
      });
      lessons.sort((a, b) => Number(a.lessonNum) - Number(b.lessonNum));
      schedule[day] = lessons;
    });
    return schedule;
  }

  /* ---------- Просмотр ---------- */
  function showView() {
    const schedule = fullSchedule[currentShift] || {};
    viewShiftTitle.textContent = currentShift + " смена";
    scheduleView.innerHTML = "";

    DAYS.forEach(day => {
      const lessons = schedule[day] || [];
      const card = document.createElement("div");
      card.className = "schedule-card";

      let listHTML = "";
      if (lessons.length === 0) {
        listHTML = '<li class="empty">(нет уроков)</li>';
      } else {
        listHTML = lessons.map(l =>
          '<li><span class="lesson-label">' + escapeHtml(l.lessonNum) + ' урок:</span> ' +
          escapeHtml(l.grade) + ' «' + escapeHtml(l.letter || "А") + '» — ' +
          escapeHtml(l.subject) + '</li>'
        ).join("");
      }
      card.innerHTML = "<h3>" + day + "</h3><ul>" + listHTML + "</ul>";
      scheduleView.appendChild(card);
    });

    shareLink.value = buildShareLink();

    viewScreen.classList.remove("hidden");
    editScreen.classList.add("hidden");
  }

  function showEdit() {
    fillForm();
    viewScreen.classList.add("hidden");
    editScreen.classList.remove("hidden");
  }

  /* ---------- Кнопки ---------- */
  document.getElementById("saveBtn").addEventListener("click", () => {
    fullSchedule[currentShift] = collectForm();
    try {
      history.replaceState(null, "", HASH_PREFIX + encodeURIComponent(JSON.stringify(fullSchedule)));
    } catch(e) { console.warn("Не удалось обновить адрес:", e); }
    showView();
  });

  document.getElementById("editBtn").addEventListener("click", showEdit);

  document.getElementById("resetBtn").addEventListener("click", () => {
    if (confirm("Удалить расписание только для " + currentShift + " смены?")) {
      fullSchedule[currentShift] = {};
      try {
        history.replaceState(null, "", HASH_PREFIX + encodeURIComponent(JSON.stringify(fullSchedule)));
      } catch(e) {}
      showEdit();
    }
  });

  document.getElementById("copyBtn").addEventListener("click", () => {
    shareLink.select();
    shareLink.setSelectionRange(0, 99999);
    try {
      document.execCommand("copy");
      alert("Ссылка скопирована ✓ (в ней обе смены)");
    } catch(e) {
      alert("Не получилось, скопируй вручную");
    }
  });

  /* ---------- Запуск ---------- */
  buildEditDays();
  const saved = loadAll();
  if (saved) {
    fullSchedule = saved;
    showView();
  } else {
    fillForm();
  }
</script>
</body>
</html>
